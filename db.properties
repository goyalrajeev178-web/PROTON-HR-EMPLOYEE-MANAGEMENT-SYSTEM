# =============================================================================
# Proton HR - Database Configuration
# =============================================================================
# Update these parameters to match your local MySQL configuration.
# Environment variables DB_URL, DB_USER, DB_PASSWORD will override these if present.

db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/proton_hr?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
db.user=root
db.password=root

# If MySQL is not reachable or credentials fail, allow smooth in-memory fallback
db.fallback.in_memory=true
